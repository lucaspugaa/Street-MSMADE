services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mismade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mismade"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Database=mismade;Username=postgres;Password=dev
      Jobs__Mode: Endpoint
      Jobs__Key: dev-key
      Seed__OwnerUser: owner
      Seed__OwnerPassword: Dev-Owner-2026!
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
